[help]
url = "https://github.com/flags-2-env-test/contract-conformance-tests"

[env]
load = false

[parse]
allow_unknown = false

[flags.port]
env = "PORT"
aliases = ["port"]
type = "integer"
default = 8080
help = "Synthetic test listener port."

[flags.log-filter]
env = "RUST_LOG"
aliases = ["log-filter"]
type = "string"
default = "info"
help = "Synthetic test log filter."
