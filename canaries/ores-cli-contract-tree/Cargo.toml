[package]
name = "ores-cli-contract-tree-canary"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "ores_cli"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
