name: ores-cli contract-tree exact-source canary

on:
  pull_request:
    paths:
      - 'canaries/ores-cli-contract-tree/**'
      - '.github/workflows/ores-cli-contract-tree-exact-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-contract-tree-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact canary head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Verify exact canary identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ores-cli-contract-tree-exact-source.yml

      - name: Prove exact ores-cli product slice
        shell: bash
        run: |
          set -euo pipefail
          root=canaries/ores-cli-contract-tree
          test "$(git hash-object "$root/src/audit/contract_tree.rs")" = '93a8a62e801aef14b3c3f55ac6fc9ca1abb7d3d5'
          test "$(git hash-object "$root/src/model.rs")" = 'fbaeb6bab206db0275f62ecf3076e48da1a3c756'
          test "$(git hash-object "$root/tests/contract_tree_external.rs")" = '66c3e70e8043a2c43f6aaad6370508ead643c1d7'
          test "$(git hash-object "$root/product/src/audit/mod.rs")" = '4b35617293ebe020eb9acc419e0c23c50b42688b'
          test "$(git hash-object "$root/product/src/lib.rs")" = '91961aa1613fed7e16bab18f7e8ee7ce72b47b77'
          test "$(git hash-object "$root/product/tjsv/source-lock.json")" = '126bf1560a80de55acbb3edd66aaad159fbeb32a'
          test "$(git hash-object "$root/product/.github/workflows/interfaces-contract-tree.yml")" = '8731533dd65377bf9685fc9002fd78cbbf612cf0'
          jq -e '.revision == "07688e1eea92a666f7e8647038c9f2c1544440ed"' \
            "$root/product/tjsv/source-lock.json"
          grep -Fqx 'mod contract_generated_evidence;' "$root/product/src/audit/mod.rs"
          grep -Fqx 'mod contract_tree;' "$root/product/src/audit/mod.rs"
          grep -Fqx 'pub use contract_tree::audit_contract_tree;' "$root/product/src/audit/mod.rs"
          grep -Fq 'options.profile == "interfaces"' "$root/product/src/lib.rs"
          grep -Fq 'python_systems::audit(&root, report)' "$root/product/src/lib.rs"
          grep -Fq 'audit_contract_tree(&tree_options).await?' "$root/product/src/lib.rs"
          grep -Fq 'opto-sync-test/contract-conformance-tests' \
            "$root/product/.github/workflows/interfaces-contract-tree.yml"
          grep -Fq '9febec9b2d10c178b25f5aca8f8e7c8b3b70094c' \
            "$root/product/.github/workflows/interfaces-contract-tree.yml"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Check out exact canonical TJSV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: 07688e1eea92a666f7e8647038c9f2c1544440ed
          path: .tjsv
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: .tjsv/package-lock.json

      - name: Install pinned TJSV dependency closure
        run: npm ci --prefix .tjsv

      - name: Expose exact TJSV executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tjsv-bin"
          cat > "$RUNNER_TEMP/tjsv-bin/tjsv" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec node "$GITHUB_WORKSPACE/.tjsv/bin/typespec-json-schema-validator.mjs" "$@"
          EOF
          chmod 0755 "$RUNNER_TEMP/tjsv-bin/tjsv"
          echo "$RUNNER_TEMP/tjsv-bin" >> "$GITHUB_PATH"

      - name: Check out hardened 3FA fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 3fa-app-test/contract-conformance-tests
          ref: 0aed088756aba6ef752b3f01b3bfef81e6df2a4d
          path: test-repos/3fa
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Check out hardened Claritas fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: claritas-viz-test/contract-conformance-tests
          ref: 7225c6caac664a26eaa7b2a7056d78a6523e9ad1
          path: test-repos/claritas
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Check out Messaging Intel fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: messaging-intel-test/contract-conformance-tests
          ref: 5dce327611648b30c6938007d50601bbdb7d9ff6
          path: test-repos/messaging-intel
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Check out Opto Sync fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opto-sync-test/contract-conformance-tests
          ref: 9febec9b2d10c178b25f5aca8f8e7c8b3b70094c
          path: test-repos/opto-sync
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Generate harness lockfile from exact pins
        working-directory: canaries/ores-cli-contract-tree
        run: cargo +1.95.0 generate-lockfile

      - name: Enforce formatting and compile all targets
        working-directory: canaries/ores-cli-contract-tree
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all -- --check
          cargo +1.95.0 check --locked --all-targets

      - name: Run exact contract-tree discovery regressions
        working-directory: canaries/ores-cli-contract-tree
        run: cargo +1.95.0 test --locked --lib -- --nocapture

      - name: Deny warnings under Clippy
        working-directory: canaries/ores-cli-contract-tree
        run: cargo +1.95.0 clippy --locked --all-targets -- -D warnings

      - name: Execute exact tree audit against 3FA test org
        working-directory: canaries/ores-cli-contract-tree
        env:
          ORES_CLI_TEST_INTERFACE_REPO: ${{ github.workspace }}/test-repos/3fa
        run: cargo +1.95.0 test --locked --test contract_tree_external -- --nocapture

      - name: Execute exact tree audit against Claritas test org
        working-directory: canaries/ores-cli-contract-tree
        env:
          ORES_CLI_TEST_INTERFACE_REPO: ${{ github.workspace }}/test-repos/claritas
        run: cargo +1.95.0 test --locked --test contract_tree_external -- --nocapture

      - name: Execute exact tree audit against Messaging Intel test org
        working-directory: canaries/ores-cli-contract-tree
        env:
          ORES_CLI_TEST_INTERFACE_REPO: ${{ github.workspace }}/test-repos/messaging-intel
        run: cargo +1.95.0 test --locked --test contract_tree_external -- --nocapture

      - name: Execute exact tree audit against Opto Sync test org
        working-directory: canaries/ores-cli-contract-tree
        env:
          ORES_CLI_TEST_INTERFACE_REPO: ${{ github.workspace }}/test-repos/opto-sync
        run: cargo +1.95.0 test --locked --test contract_tree_external -- --nocapture

      - name: Prove all authored fixtures remained immutable
        shell: bash
        run: |
          set -euo pipefail
          git -C test-repos/3fa diff --exit-code -- .
          git -C test-repos/claritas diff --exit-code -- .
          git -C test-repos/messaging-intel diff --exit-code -- .
          git -C test-repos/opto-sync diff --exit-code -- .
          git diff --check
