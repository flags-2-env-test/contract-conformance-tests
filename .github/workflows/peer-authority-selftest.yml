name: Peer authority TJSV self-test

on:
  pull_request:
    paths:
      - 'contracts/peer-authority-canary/**'
      - 'scripts/check-peer-authority-paths.sh'
      - '.github/workflows/peer-authority-convergence.yml'
      - '.github/workflows/peer-authority-selftest.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/peer-authority-canary/**'
      - 'scripts/check-peer-authority-paths.sh'
      - '.github/workflows/peer-authority-convergence.yml'
      - '.github/workflows/peer-authority-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  path-negative-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Accept normal authored peer paths
        run: >-
          sh scripts/check-peer-authority-paths.sh
          contracts/peer-authority-canary/main.tsp
          contracts/peer-authority-canary/authored.schema.json

      - name: Reject generated and evidence paths for both authored peers
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/contracts/generated" "$tmp/contracts/evidence" "$tmp/contracts/authored"
          cp contracts/peer-authority-canary/main.tsp "$tmp/contracts/generated/main.tsp"
          cp contracts/peer-authority-canary/main.tsp "$tmp/contracts/authored/main.tsp"
          cp contracts/peer-authority-canary/authored.schema.json "$tmp/contracts/evidence/authored.schema.json"
          cp contracts/peer-authority-canary/authored.schema.json "$tmp/contracts/authored/authored.schema.json"
          cp scripts/check-peer-authority-paths.sh "$tmp/check.sh"
          (
            cd "$tmp"
            if sh check.sh contracts/generated/main.tsp contracts/authored/authored.schema.json; then
              echo 'generated TypeSpec authority unexpectedly admitted' >&2
              exit 1
            fi
            if sh check.sh contracts/authored/main.tsp contracts/evidence/authored.schema.json; then
              echo 'evidence JSON Schema authority unexpectedly admitted' >&2
              exit 1
            fi
          )

      - name: Keep generated JSON witnesses distinct from authored authority names
        shell: bash
        run: |
          set -euo pipefail
          case '.typespec-json-schema-validator/peer-authority/generated/typespec.generated.schema.json' in
            */authored.schema.json)
              echo 'generated witness collided with authored authority filename' >&2
              exit 1
              ;;
          esac

  semantic-negative-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Reject one-sided authored JSON Schema drift with current TJSV
        id: json_schema_drift
        continue-on-error: true
        uses: ORESoftware/typespec-json-schema-validator@c5392b03a405bb5296d1de09ac785b3b097529cd
        with:
          typespec: contracts/peer-authority-canary/main.tsp
          schema: contracts/peer-authority-canary/negative/authored-name-max63.schema.json
          instances: contracts/peer-authority-canary/instances
          report: .typespec-json-schema-validator/negative-json/report.json
          contract_ir: .typespec-json-schema-validator/negative-json/contract-ir.json
          output_dir: .typespec-json-schema-validator/negative-json/generated
          quiet: 'false'

      - name: Require authored JSON Schema drift to fail closed with retained Schema B
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.json_schema_drift.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          test -s .typespec-json-schema-validator/negative-json/report.json
          test -s .typespec-json-schema-validator/negative-json/contract-ir.json
          test -s .typespec-json-schema-validator/negative-json/generated/typespec.generated.schema.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('.typespec-json-schema-validator/negative-json/report.json', 'utf8'));
          const ir = JSON.parse(fs.readFileSync('.typespec-json-schema-validator/negative-json/contract-ir.json', 'utf8'));
          if (report.status === 'passed') throw new Error(`expected fail-closed JSON Schema drift, got ${JSON.stringify(report.status)}`);
          if (!Array.isArray(report.findings) || report.findings.length === 0) throw new Error('JSON Schema drift rejection emitted no findings');
          if (ir.status === 'passed' || ir.admissible === true) throw new Error('JSON Schema drift Contract IR remained admissible');
          NODE

      - name: Reject one-sided TypeSpec drift after transpilation with current TJSV
        id: typespec_drift
        continue-on-error: true
        uses: ORESoftware/typespec-json-schema-validator@c5392b03a405bb5296d1de09ac785b3b097529cd
        with:
          typespec: contracts/peer-authority-canary/negative/typespec-name-max63.tsp
          schema: contracts/peer-authority-canary/authored.schema.json
          instances: contracts/peer-authority-canary/instances
          report: .typespec-json-schema-validator/negative-typespec/report.json
          contract_ir: .typespec-json-schema-validator/negative-typespec/contract-ir.json
          output_dir: .typespec-json-schema-validator/negative-typespec/generated
          quiet: 'false'

      - name: Require TypeSpec drift to fail closed with retained Schema B
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.typespec_drift.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          test -s .typespec-json-schema-validator/negative-typespec/report.json
          test -s .typespec-json-schema-validator/negative-typespec/contract-ir.json
          test -s .typespec-json-schema-validator/negative-typespec/generated/typespec.generated.schema.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('.typespec-json-schema-validator/negative-typespec/report.json', 'utf8'));
          const ir = JSON.parse(fs.readFileSync('.typespec-json-schema-validator/negative-typespec/contract-ir.json', 'utf8'));
          if (report.status === 'passed') throw new Error(`expected fail-closed TypeSpec drift, got ${JSON.stringify(report.status)}`);
          if (!Array.isArray(report.findings) || report.findings.length === 0) throw new Error('TypeSpec drift rejection emitted no findings');
          if (ir.status === 'passed' || ir.admissible === true) throw new Error('TypeSpec drift Contract IR remained admissible');
          NODE

      - name: Prove negative controls never mutate authored authorities
        if: always()
        shell: bash
        run: git diff --exit-code -- contracts/peer-authority-canary/

  peer-authority:
    uses: ./.github/workflows/peer-authority-convergence.yml
    with:
      typespec_path: contracts/peer-authority-canary/main.tsp
      schema_path: contracts/peer-authority-canary/authored.schema.json
      instances_path: contracts/peer-authority-canary/instances
      expected_declarations_json: '["OresPeerCanary.PeerAuthorityCanaryV1"]'
