name: Peer authority TJSV self-test

on:
  pull_request:
    paths:
      - 'contracts/peer-authority-canary/**'
      - 'scripts/check-peer-authority-paths.sh'
      - '.github/workflows/peer-authority-convergence.yml'
      - '.github/workflows/peer-authority-selftest.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/peer-authority-canary/**'
      - 'scripts/check-peer-authority-paths.sh'
      - '.github/workflows/peer-authority-convergence.yml'
      - '.github/workflows/peer-authority-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  path-negative-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Accept normal authored peer paths
        run: >-
          sh scripts/check-peer-authority-paths.sh
          contracts/peer-authority-canary/main.tsp
          contracts/peer-authority-canary/authored.schema.json

      - name: Reject generated and evidence paths for both authored peers
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/contracts/generated" "$tmp/contracts/evidence" "$tmp/contracts/authored"
          cp contracts/peer-authority-canary/main.tsp "$tmp/contracts/generated/main.tsp"
          cp contracts/peer-authority-canary/main.tsp "$tmp/contracts/authored/main.tsp"
          cp contracts/peer-authority-canary/authored.schema.json "$tmp/contracts/evidence/authored.schema.json"
          cp contracts/peer-authority-canary/authored.schema.json "$tmp/contracts/authored/authored.schema.json"
          cp scripts/check-peer-authority-paths.sh "$tmp/check.sh"
          (
            cd "$tmp"
            if sh check.sh contracts/generated/main.tsp contracts/authored/authored.schema.json; then
              echo 'generated TypeSpec authority unexpectedly admitted' >&2
              exit 1
            fi
            if sh check.sh contracts/authored/main.tsp contracts/evidence/authored.schema.json; then
              echo 'evidence JSON Schema authority unexpectedly admitted' >&2
              exit 1
            fi
          )

      - name: Keep generated JSON witnesses distinct from authored authority names
        shell: bash
        run: |
          set -euo pipefail
          case '.typespec-json-schema-validator/peer-authority/generated/typespec.generated.schema.json' in
            */authored.schema.json)
              echo 'generated witness collided with authored authority filename' >&2
              exit 1
              ;;
          esac

  one-sided-peer-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Node 22.16.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'

      - name: Check out exact TJSV source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: f848361571af11f0280d309968269cbff8851524
          path: .deps/tjsv
          persist-credentials: false
          show-progress: false

      - name: Install the validator lockfile graph
        working-directory: .deps/tjsv
        run: npm ci --omit=dev

      - name: Reject TypeSpec-only semantic drift
        shell: bash
        run: |
          set -euo pipefail
          tsp='contracts/peer-authority-canary/main.tsp'
          schema='contracts/peer-authority-canary/authored.schema.json'
          instances='contracts/peer-authority-canary/instances'
          cp "$tsp" "$RUNNER_TEMP/main.tsp.original"
          trap 'cp "$RUNNER_TEMP/main.tsp.original" "$tsp"' EXIT
          perl -0pi -e 's/\@maxLength\(64\)/\@maxLength(63)/' "$tsp"
          grep -F '@maxLength(63)' "$tsp"
          set +e
          (
            cd .deps/tjsv
            node bin/typespec-json-schema-validator.mjs check \
              --typespec="$GITHUB_WORKSPACE/$tsp" \
              --schema="$GITHUB_WORKSPACE/$schema" \
              --instances="$GITHUB_WORKSPACE/$instances" \
              --report="$RUNNER_TEMP/typespec-drift-report.json" \
              --output-dir="$RUNNER_TEMP/typespec-drift-generated" \
              --quiet
          )
          code=$?
          set -e
          test "$code" -eq 2 || {
            echo "expected TypeSpec-only drift to stop for evaluation with exit 2; got $code" >&2
            exit 1
          }
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(r.status!=="stopped_for_evaluation" || !(r.findings?.length>0)) process.exit(1)' "$RUNNER_TEMP/typespec-drift-report.json"
          cp "$RUNNER_TEMP/main.tsp.original" "$tsp"
          trap - EXIT

      - name: Reject authored-JSON-only semantic drift
        shell: bash
        run: |
          set -euo pipefail
          tsp='contracts/peer-authority-canary/main.tsp'
          schema='contracts/peer-authority-canary/authored.schema.json'
          instances='contracts/peer-authority-canary/instances'
          cp "$schema" "$RUNNER_TEMP/authored.schema.json.original"
          trap 'cp "$RUNNER_TEMP/authored.schema.json.original" "$schema"' EXIT
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'contracts/peer-authority-canary/authored.schema.json';
          const schema = JSON.parse(fs.readFileSync(path, 'utf8'));
          schema.$defs.PeerAuthorityCanaryV1.properties.name.maxLength = 63;
          fs.writeFileSync(path, `${JSON.stringify(schema, null, 2)}\n`);
          NODE
          grep -F '"maxLength": 63' "$schema"
          set +e
          (
            cd .deps/tjsv
            node bin/typespec-json-schema-validator.mjs check \
              --typespec="$GITHUB_WORKSPACE/$tsp" \
              --schema="$GITHUB_WORKSPACE/$schema" \
              --instances="$GITHUB_WORKSPACE/$instances" \
              --report="$RUNNER_TEMP/json-drift-report.json" \
              --output-dir="$RUNNER_TEMP/json-drift-generated" \
              --quiet
          )
          code=$?
          set -e
          test "$code" -eq 2 || {
            echo "expected authored-JSON-only drift to stop for evaluation with exit 2; got $code" >&2
            exit 1
          }
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(r.status!=="stopped_for_evaluation" || !(r.findings?.length>0)) process.exit(1)' "$RUNNER_TEMP/json-drift-report.json"
          cp "$RUNNER_TEMP/authored.schema.json.original" "$schema"
          trap - EXIT

      - name: Prove tracked authorities were restored byte-for-byte
        run: git diff --exit-code -- contracts/peer-authority-canary/main.tsp contracts/peer-authority-canary/authored.schema.json

  peer-authority:
    uses: ./.github/workflows/peer-authority-convergence.yml
    with:
      typespec_path: contracts/peer-authority-canary/main.tsp
      schema_path: contracts/peer-authority-canary/authored.schema.json
      instances_path: contracts/peer-authority-canary/instances
