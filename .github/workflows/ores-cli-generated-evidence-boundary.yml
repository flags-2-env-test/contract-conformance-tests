name: ores-cli generated-evidence boundary canary

on:
  pull_request:
    paths:
      - 'canaries/ores-cli-generated-evidence-boundary/**'
      - '.github/workflows/ores-cli-generated-evidence-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-generated-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-exact-product-slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact review head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate canary workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ores-cli-generated-evidence-boundary.yml

      - name: Prove exact ores-cli candidate blobs and dispatcher wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          root='canaries/ores-cli-generated-evidence-boundary'
          test "$(git hash-object "$root/src/audit/contract_generated_evidence.rs")" = '0533c0995ced15765d2d63da1a418b0164256644'
          test "$(git hash-object "$root/product-audit-mod.rs")" = '7f83f651d8e2d7694ac8a020d279ad047ab595fc'
          grep -Fqx 'mod contract_generated_evidence;' "$root/product-audit-mod.rs"
          grep -Fq 'contract_generated_evidence::augment_contract_generated_evidence_audit(' "$root/product-audit-mod.rs"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Format exact module and canary harness
        run: cargo +1.95.0 fmt --manifest-path canaries/ores-cli-generated-evidence-boundary/Cargo.toml --all -- --check

      - name: Compile canary harness
        run: cargo +1.95.0 check --manifest-path canaries/ores-cli-generated-evidence-boundary/Cargo.toml --all-targets

      - name: Run exact embedded product regressions
        run: cargo +1.95.0 test --manifest-path canaries/ores-cli-generated-evidence-boundary/Cargo.toml --all-targets

      - name: Deny warnings under Clippy
        run: cargo +1.95.0 clippy --manifest-path canaries/ores-cli-generated-evidence-boundary/Cargo.toml --all-targets -- -D warnings

      - name: Repeat regressions optimized
        run: cargo +1.95.0 test --release --manifest-path canaries/ores-cli-generated-evidence-boundary/Cargo.toml --all-targets
