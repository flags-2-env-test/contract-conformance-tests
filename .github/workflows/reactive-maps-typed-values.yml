name: reactive-maps typed values exact-file proof

on:
  pull_request:
    paths:
      - '.github/workflows/reactive-maps-typed-values.yml'
      - 'fixtures/ores-reactive-maps-pr3/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact reviewed TypeScript surface
        working-directory: fixtures/ores-reactive-maps-pr3
        run: |
          npm install --ignore-scripts
          npm test
          npm run build
