name: ores-cli instance-corpus exact-source certification

on:
  pull_request:
    paths:
      - 'canaries/ores-cli-instance-corpus/**'
      - '.github/workflows/ores-cli-instance-corpus-exact-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-instance-corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact certification head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact certification and product blob identities
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          root=canaries/ores-cli-instance-corpus
          test "$(git hash-object "$root/src/audit/contract_instance_corpus.rs")" = '66ded46759f5404c379d5fea16d3ee2ac0eb65e5'
          grep -Fq 'struct RepositoryAuditOptions' "$root/src/audit/mod.rs"
          grep -Fq 'pub struct CommandReport' "$root/src/model.rs"

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ores-cli-instance-corpus-exact-source.yml

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Generate a run-local dependency lock
        working-directory: canaries/ores-cli-instance-corpus
        run: cargo +1.95.0 generate-lockfile

      - name: Prove exact product source is rustfmt-clean
        run: rustfmt +1.95.0 --check canaries/ores-cli-instance-corpus/src/audit/contract_instance_corpus.rs

      - name: Compile and execute positive and adversarial corpus regressions
        working-directory: canaries/ores-cli-instance-corpus
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ores-cli-instance-corpus-target
        run: cargo +1.95.0 test --locked --all-targets -- --nocapture

      - name: Deny warnings in the exact-source canary
        working-directory: canaries/ores-cli-instance-corpus
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ores-cli-instance-corpus-target
        run: cargo +1.95.0 clippy --locked --all-targets -- -D warnings

      - name: Prove canary sources remained immutable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canaries/ores-cli-instance-corpus/src/audit/contract_instance_corpus.rs)" = '66ded46759f5404c379d5fea16d3ee2ac0eb65e5'
          git diff --exit-code -- canaries/ores-cli-instance-corpus/src
          git diff --check
