name: Peer authority TJSV convergence

on:
  workflow_call:
    inputs:
      typespec_path:
        description: Repository-relative independent TypeSpec authority.
        required: true
        type: string
      schema_path:
        description: Repository-relative independently authored Draft 2020-12 JSON Schema authority.
        required: true
        type: string
      instances_path:
        description: Repository-relative TJSV positive/negative instance corpus.
        required: true
        type: string
      expected_declarations_json:
        description: Exact JSON array of qualified declarations admitted for this canary.
        required: true
        type: string

permissions:
  contents: read

jobs:
  convergence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact caller candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Reject generated or evidence paths as authored authorities
        shell: bash
        env:
          TYPESPEC_PATH: ${{ inputs.typespec_path }}
          SCHEMA_PATH: ${{ inputs.schema_path }}
          EXPECTED_DECLARATIONS: ${{ inputs.expected_declarations_json }}
        run: |
          set -euo pipefail
          safe_relative_authority() {
            local path="$1"
            case "$path" in
              /*|../*|*/../*|*/..|..) return 1 ;;
            esac
            IFS='/' read -r -a components <<< "$path"
            for component in "${components[@]}"; do
              case "$component" in
                generated|evidence|.canary-evidence|.typespec-json-schema-validator|target|dist|build|artifacts)
                  return 1
                  ;;
              esac
            done
          }
          test -f "$TYPESPEC_PATH"
          test -f "$SCHEMA_PATH"
          test "$TYPESPEC_PATH" != "$SCHEMA_PATH"
          safe_relative_authority "$TYPESPEC_PATH"
          safe_relative_authority "$SCHEMA_PATH"
          case "$TYPESPEC_PATH" in *.tsp) ;; *) exit 6 ;; esac
          case "$SCHEMA_PATH" in *.json) ;; *) exit 6 ;; esac
          node -e 'const value=JSON.parse(process.argv[1]); if (!Array.isArray(value)||value.length===0||value.some((x)=>typeof x!=="string"||!x.includes("."))||new Set(value).size!==value.length) process.exit(7)' "$EXPECTED_DECLARATIONS"

      - name: Bind independently authored authority bytes
        shell: bash
        env:
          TYPESPEC_PATH: ${{ inputs.typespec_path }}
          SCHEMA_PATH: ${{ inputs.schema_path }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/peer-authority"
          sha256sum "$TYPESPEC_PATH" "$SCHEMA_PATH" > "$RUNNER_TEMP/peer-authority/authorities.before.sha256"

      - name: Compile TypeSpec to comparison Schema B and compare peer authorities
        uses: ORESoftware/typespec-json-schema-validator@a952c53b4628b1d12e21ed51879d910a8c19a581
        with:
          typespec: ${{ inputs.typespec_path }}
          schema: ${{ inputs.schema_path }}
          instances: ${{ inputs.instances_path }}
          report: .typespec-json-schema-validator/peer-authority/report.json
          sarif: .typespec-json-schema-validator/peer-authority/report.sarif
          contract_ir: .typespec-json-schema-validator/peer-authority/contract-ir.json
          output_dir: .typespec-json-schema-validator/peer-authority/generated
          quiet: 'false'

      - name: Verify current inputs, generated Schema B, receipt, IR, and exact declaration scope
        uses: ORESoftware/typespec-json-schema-validator/actions/verify-contract-ir@a952c53b4628b1d12e21ed51879d910a8c19a581
        with:
          contract_ir: .typespec-json-schema-validator/peer-authority/contract-ir.json
          report: .typespec-json-schema-validator/peer-authority/report.json
          typespec: ${{ inputs.typespec_path }}
          schema: ${{ inputs.schema_path }}
          generated_schema: .typespec-json-schema-validator/peer-authority/generated/typespec.generated.schema.json
          expected_declarations: ${{ inputs.expected_declarations_json }}
          verification: .typespec-json-schema-validator/peer-authority/consumer-verification.json

      - name: Prove Schema B comparison and first-class peer-authority admission
        shell: bash
        env:
          TYPESPEC_PATH: ${{ inputs.typespec_path }}
          SCHEMA_PATH: ${{ inputs.schema_path }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('.typespec-json-schema-validator/peer-authority/report.json', 'utf8'));
          const ir = JSON.parse(fs.readFileSync('.typespec-json-schema-validator/peer-authority/contract-ir.json', 'utf8'));
          const fail = (message) => { throw new Error(message); };

          if (report.schema !== 'ores.typespec-json-schema-validator.report/v1') fail('unexpected parity report schema');
          if (report.status !== 'passed' || report.zeroUnexplainedFindings !== true) fail('peer-authority parity did not pass cleanly');
          if (report.authorities?.typespec?.authority !== 'independently-authored') fail('TypeSpec is not independently authored');
          if (report.authorities?.jsonSchema?.authority !== 'independently-authored') fail('JSON Schema is not independently authored');
          if (report.authorities?.jsonSchema?.dialect !== 'https://json-schema.org/draft/2020-12/schema') fail('JSON Schema is not Draft 2020-12');
          if (report.authorities?.typespec?.generatedJsonSchemaRole !== 'comparison-evidence-only') fail('Schema B is not comparison-only evidence');
          if (report.authorities?.precedence !== 'none') fail('one authored authority incorrectly has precedence');

          for (const key of ['directDeclarationInventory','typespecGeneratedJsonSchemaComparison','differentialInstanceValidation','sourceMutationCheck']) {
            if (report.coverage?.[key] !== true) fail(`required TJSV coverage missing: ${key}`);
          }

          const inputs = report.inputs ?? {};
          for (const key of ['typespec', 'authoredJsonSchema', 'generatedJsonSchema']) {
            if (!inputs[key]?.input || !inputs[key]?.digest) fail(`missing bound report input: ${key}`);
          }
          if (inputs.typespec.input !== process.env.TYPESPEC_PATH) fail('report TypeSpec input is not caller authority');
          if (inputs.authoredJsonSchema.input !== process.env.SCHEMA_PATH) fail('report JSON Schema input is not caller authority');
          if (inputs.generatedJsonSchema.input === inputs.authoredJsonSchema.input) fail('generated Schema B collided with authored Schema A');
          if (!inputs.generatedJsonSchema.input.includes('.typespec-json-schema-validator/peer-authority/generated/')) fail('Schema B escaped evidence lane');

          const differential = report.differential?.summary;
          if (!differential || !Number.isInteger(differential.probesEvaluated) || differential.probesEvaluated <= 0) fail('no differential probes evaluated');
          if (differential.divergences !== 0 || differential.refusals !== 0) fail('generated and authored schema lanes disagree');

          const expected = { typespec: 'independently-authored', jsonSchema: 'independently-authored', generatedJsonSchema: 'comparison-evidence-only', precedence: 'none' };
          for (const [key, value] of Object.entries(expected)) {
            if (ir.authorities?.[key] !== value) fail(`unexpected Contract IR authority role: ${key}`);
          }
          if (ir.status !== 'passed' || ir.admissible !== true || ir.admission?.scope?.complete !== true) fail('Contract IR is not complete/admissible');
          NODE

      - name: Create temporary JSON-Schema-only drift witness
        shell: bash
        env:
          SCHEMA_PATH: ${{ inputs.schema_path }}
        run: |
          set -euo pipefail
          mkdir -p target/tjsv-negative-control
          cp "$SCHEMA_PATH" target/tjsv-negative-control/authored.schema.json
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'target/tjsv-negative-control/authored.schema.json';
          const schema = JSON.parse(fs.readFileSync(path, 'utf8'));
          let mutated = false;
          const visit = (node) => {
            if (mutated || !node || typeof node !== 'object' || Array.isArray(node)) return;
            if (node.type === 'object' && node.properties && typeof node.properties === 'object' && !Array.isArray(node.properties)) {
              const marker = '__tjsvNegativeControl';
              if (Object.prototype.hasOwnProperty.call(node.properties, marker)) throw new Error('negative-control marker already exists');
              node.properties[marker] = { type: 'string', const: 'drift-must-fail' };
              const required = Array.isArray(node.required) ? [...node.required] : [];
              if (!required.includes(marker)) required.push(marker);
              node.required = required;
              mutated = true;
              return;
            }
            for (const value of Object.values(node)) visit(value);
          };
          visit(schema);
          if (!mutated) throw new Error('no object schema with properties available for drift canary');
          fs.writeFileSync(path, `${JSON.stringify(schema, null, 2)}\n`);
          NODE

      - name: Require one-authority JSON Schema drift to fail closed
        id: negative_schema_drift
        continue-on-error: true
        uses: ORESoftware/typespec-json-schema-validator@a952c53b4628b1d12e21ed51879d910a8c19a581
        with:
          typespec: ${{ inputs.typespec_path }}
          schema: target/tjsv-negative-control/authored.schema.json
          instances: ${{ inputs.instances_path }}
          report: .typespec-json-schema-validator/peer-authority/negative/report.json
          contract_ir: .typespec-json-schema-validator/peer-authority/negative/contract-ir.json
          output_dir: .typespec-json-schema-validator/peer-authority/negative/generated
          quiet: 'false'

      - name: Prove drift canary was rejected with non-admissible evidence
        if: always()
        shell: bash
        env:
          NEGATIVE_OUTCOME: ${{ steps.negative_schema_drift.outcome }}
        run: |
          set -euo pipefail
          test "$NEGATIVE_OUTCOME" = failure
          test -s .typespec-json-schema-validator/peer-authority/negative/report.json
          test -s .typespec-json-schema-validator/peer-authority/negative/contract-ir.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('.typespec-json-schema-validator/peer-authority/negative/report.json', 'utf8'));
          const ir = JSON.parse(fs.readFileSync('.typespec-json-schema-validator/peer-authority/negative/contract-ir.json', 'utf8'));
          if (report.status === 'passed') throw new Error('TJSV incorrectly admitted one-authority drift');
          if (!Array.isArray(report.findings) || report.findings.length === 0) throw new Error('drift rejection emitted no findings');
          if (ir.status === 'passed' || ir.admissible === true) throw new Error('drift Contract IR remained admissible');
          NODE

      - name: Prove source immutability and generated comparison evidence
        if: always()
        shell: bash
        env:
          TYPESPEC_PATH: ${{ inputs.typespec_path }}
          SCHEMA_PATH: ${{ inputs.schema_path }}
        run: |
          set -euo pipefail
          sha256sum "$TYPESPEC_PATH" "$SCHEMA_PATH" > "$RUNNER_TEMP/peer-authority/authorities.after.sha256"
          cmp "$RUNNER_TEMP/peer-authority/authorities.before.sha256" "$RUNNER_TEMP/peer-authority/authorities.after.sha256"
          test -s .typespec-json-schema-validator/peer-authority/report.json
          test -s .typespec-json-schema-validator/peer-authority/report.sarif
          test -s .typespec-json-schema-validator/peer-authority/contract-ir.json
          test -s .typespec-json-schema-validator/peer-authority/generated/typespec.generated.schema.json
          test -s .typespec-json-schema-validator/peer-authority/consumer-verification.json
          test '.typespec-json-schema-validator/peer-authority/generated/typespec.generated.schema.json' != "$SCHEMA_PATH"
          git diff --exit-code -- "$TYPESPEC_PATH" "$SCHEMA_PATH"

      - name: Retain deterministic parity and drift-rejection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: peer-authority-tjsv-${{ github.sha }}
          path: .typespec-json-schema-validator/peer-authority/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
