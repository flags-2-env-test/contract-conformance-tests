name: Peer authority TJSV convergence

on:
  workflow_call:
    inputs:
      typespec_path:
        description: Repository-relative independent TypeSpec authority.
        required: true
        type: string
      schema_path:
        description: Repository-relative independently authored Draft 2020-12 JSON Schema authority.
        required: true
        type: string
      instances_path:
        description: Repository-relative TJSV positive/negative instance corpus.
        required: true
        type: string

permissions:
  contents: read

jobs:
  convergence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact caller candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Reject generated or evidence paths as authored authorities
        shell: bash
        env:
          TYPESPEC_PATH: ${{ inputs.typespec_path }}
          SCHEMA_PATH: ${{ inputs.schema_path }}
        run: |
          set -euo pipefail
          safe_relative_authority() {
            local path="$1"
            case "$path" in
              /*|../*|*/../*|*/..|..) return 1 ;;
            esac
            IFS='/' read -r -a components <<< "$path"
            for component in "${components[@]}"; do
              case "$component" in
                generated|evidence|.canary-evidence|.typespec-json-schema-validator|target|dist|build|artifacts)
                  return 1
                  ;;
              esac
            done
          }
          test -f "$TYPESPEC_PATH"
          test -f "$SCHEMA_PATH"
          test "$TYPESPEC_PATH" != "$SCHEMA_PATH"
          safe_relative_authority "$TYPESPEC_PATH"
          safe_relative_authority "$SCHEMA_PATH"
          case "$TYPESPEC_PATH" in *.tsp) ;; *) exit 6 ;; esac
          case "$SCHEMA_PATH" in *.json) ;; *) exit 6 ;; esac

      - name: Bind independently authored authority bytes
        shell: bash
        env:
          TYPESPEC_PATH: ${{ inputs.typespec_path }}
          SCHEMA_PATH: ${{ inputs.schema_path }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/peer-authority"
          sha256sum "$TYPESPEC_PATH" "$SCHEMA_PATH" > "$RUNNER_TEMP/peer-authority/authorities.before.sha256"

      - name: Compile TypeSpec to comparison JSON and compare both peer authorities
        uses: ORESoftware/typespec-json-schema-validator@93dd73cb246a09b0a1c62d7192cc62ca6ecbe405
        with:
          typespec: ${{ inputs.typespec_path }}
          schema: ${{ inputs.schema_path }}
          instances: ${{ inputs.instances_path }}
          report: .typespec-json-schema-validator/peer-authority/report.json
          contract_ir: .typespec-json-schema-validator/peer-authority/contract-ir.json
          output_dir: .typespec-json-schema-validator/peer-authority/generated
          quiet: 'false'

      - name: Prove Schema B comparison and dual-authority admission
        shell: bash
        env:
          TYPESPEC_PATH: ${{ inputs.typespec_path }}
          SCHEMA_PATH: ${{ inputs.schema_path }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const reportPath = '.typespec-json-schema-validator/peer-authority/report.json';
          const irPath = '.typespec-json-schema-validator/peer-authority/contract-ir.json';
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const ir = JSON.parse(fs.readFileSync(irPath, 'utf8'));

          const fail = (message) => { throw new Error(message); };
          if (report.schema !== 'ores.typespec-json-schema-validator.report/v1') {
            fail('unexpected parity report schema');
          }
          if (report.status !== 'passed' || report.zeroUnexplainedFindings !== true) {
            fail('peer-authority parity did not pass cleanly');
          }
          if (report.authorities?.typespec?.authority !== 'independently-authored') {
            fail('TypeSpec is not recorded as an independently authored authority');
          }
          if (report.authorities?.jsonSchema?.authority !== 'independently-authored') {
            fail('JSON Schema is not recorded as an independently authored authority');
          }
          if (report.authorities?.jsonSchema?.dialect !== 'https://json-schema.org/draft/2020-12/schema') {
            fail('authored JSON Schema is not Draft 2020-12');
          }
          if (report.authorities?.typespec?.generatedJsonSchemaRole !== 'comparison-evidence-only') {
            fail('TypeSpec-generated JSON Schema is not comparison-only evidence');
          }
          if (report.authorities?.precedence !== 'none') {
            fail('one authored authority incorrectly has precedence');
          }

          for (const key of [
            'directDeclarationInventory',
            'typespecGeneratedJsonSchemaComparison',
            'differentialInstanceValidation',
            'sourceMutationCheck',
          ]) {
            if (report.coverage?.[key] !== true) fail(`required TJSV coverage missing: ${key}`);
          }

          const inputs = report.inputs ?? {};
          for (const key of ['typespec', 'authoredJsonSchema', 'generatedJsonSchema']) {
            if (!inputs[key]?.input || !inputs[key]?.digest) fail(`missing bound report input: ${key}`);
          }
          if (inputs.typespec.input !== process.env.TYPESPEC_PATH) {
            fail('report TypeSpec input is not the caller-authored authority');
          }
          if (inputs.authoredJsonSchema.input !== process.env.SCHEMA_PATH) {
            fail('report JSON Schema input is not the caller-authored authority');
          }
          if (inputs.generatedJsonSchema.input === inputs.authoredJsonSchema.input) {
            fail('generated Schema B collided with authored JSON Schema A');
          }
          if (!inputs.generatedJsonSchema.input.includes('.typespec-json-schema-validator/peer-authority/generated/')) {
            fail('generated Schema B escaped the comparison-evidence output lane');
          }

          const differential = report.differential?.summary;
          if (!differential || !Number.isInteger(differential.probesEvaluated) || differential.probesEvaluated <= 0) {
            fail('no differential probes were evaluated against both schema lanes');
          }
          if (differential.divergences !== 0 || differential.refusals !== 0) {
            fail('generated and authored JSON Schema lanes disagree on differential probes');
          }

          const expectedIrAuthorities = {
            typespec: 'independently-authored',
            jsonSchema: 'independently-authored',
            generatedJsonSchema: 'comparison-evidence-only',
            precedence: 'none',
          };
          for (const [key, value] of Object.entries(expectedIrAuthorities)) {
            if (ir.authorities?.[key] !== value) fail(`unexpected Contract IR authority role: ${key}`);
          }
          if (ir.status !== 'passed' || ir.admissible !== true) {
            fail('Contract IR is not admissible');
          }
          NODE

      - name: Prove source immutability and generated comparison evidence
        shell: bash
        env:
          TYPESPEC_PATH: ${{ inputs.typespec_path }}
          SCHEMA_PATH: ${{ inputs.schema_path }}
        run: |
          set -euo pipefail
          sha256sum "$TYPESPEC_PATH" "$SCHEMA_PATH" > "$RUNNER_TEMP/peer-authority/authorities.after.sha256"
          cmp "$RUNNER_TEMP/peer-authority/authorities.before.sha256" "$RUNNER_TEMP/peer-authority/authorities.after.sha256"
          test -s .typespec-json-schema-validator/peer-authority/report.json
          test -s .typespec-json-schema-validator/peer-authority/contract-ir.json
          generated="$(find .typespec-json-schema-validator/peer-authority/generated -type f -name '*.json' -size +0c -print -quit)"
          test -n "$generated"
          test "$generated" != "$SCHEMA_PATH"

      - name: Retain deterministic parity evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: peer-authority-tjsv-${{ github.sha }}
          path: .typespec-json-schema-validator/peer-authority/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
